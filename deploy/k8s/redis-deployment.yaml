# Redis de uso exclusivo como cache de previsões (não é fonte de verdade de
# nada — perder o conteúdo só significa recalcular algumas previsões).
# Por isso um Deployment de réplica única com PVC é aceitável aqui; para um
# Redis crítico de negócio, prefira um Redis gerenciado (ElastiCache/
# Memorystore) ou um Operator com replicação (ex.: Redis Sentinel/Cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: house-price-prediction
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate # evita 2 pods escrevendo no mesmo PVC ReadWriteOnce simultaneamente
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
