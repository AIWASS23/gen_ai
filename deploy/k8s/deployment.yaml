apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-api
  namespace: house-price-prediction
  labels:
    app.kubernetes.io/name: house-price-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # nunca reduz capacidade durante o rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: house-price-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: house-price-api
    spec:
      # Executa como usuário não-root (ver Dockerfile: useradd appuser, uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          # Substitua pela imagem publicada no seu registry (ex.: pipeline de
          # CI/CD faz `docker build` + `docker push` + atualiza esta tag).
          image: house-price-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: house-price-api-config
            - secretRef:
                name: house-price-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # uvicorn/joblib podem gravar em /tmp
            capabilities:
              drop: ["ALL"]
