# Overlay opcional: Langfuse self-hosted completo, para observabilidade
# local/on-prem sem depender do Langfuse Cloud.
#
# Baseado na lista de serviços oficial em
# https://github.com/langfuse/langfuse/blob/main/docker-compose.yml
# (Postgres + ClickHouse + MinIO + Redis + web + worker — a v4 do Langfuse
# exige toda essa infra, bem mais pesada que a v2, que precisava só de
# Postgres). Testado de ponta a ponta neste projeto — ver
# `deploy/README.md` para o passo a passo e o resultado da validação.
#
# Uso:
#   1. Gere segredos (uma vez) e exporte (ou coloque em deploy/.env):
#        export LANGFUSE_ENCRYPTION_KEY=$(openssl rand -hex 32)
#        export LANGFUSE_SALT=$(openssl rand -base64 32)
#        export LANGFUSE_NEXTAUTH_SECRET=$(openssl rand -base64 32)
#        export LANGFUSE_POSTGRES_PASSWORD=$(openssl rand -base64 24)
#        export LANGFUSE_CLICKHOUSE_PASSWORD=$(openssl rand -base64 24)
#        export LANGFUSE_MINIO_PASSWORD=$(openssl rand -base64 24)
#        export LANGFUSE_REDIS_PASSWORD=$(openssl rand -base64 24)
#        export LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-$(openssl rand -hex 16)
#        export LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-$(openssl rand -hex 16)
#        export LANGFUSE_INIT_USER_PASSWORD=$(openssl rand -base64 16)
#   2. Suba tudo, incluindo a API, com o profile "observability":
#        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.langfuse.yml \
#          --profile observability up --build
#   3. Org/projeto/usuário/chaves são criados automaticamente no primeiro
#      startup (inicialização headless, sem precisar abrir a UI) — as
#      chaves são exatamente LANGFUSE_INIT_PROJECT_PUBLIC_KEY/
#      LANGFUSE_INIT_PROJECT_SECRET_KEY definidas acima. Configure-as na
#      API via APP_LANGFUSE_PUBLIC_KEY/APP_LANGFUSE_SECRET_KEY +
#      APP_LANGFUSE_HOST=http://langfuse-web:3000 (dentro da rede docker)
#      e reinicie o serviço `api`. UI em http://localhost:3000
#      (usuário admin@house-price.local / LANGFUSE_INIT_USER_PASSWORD).

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-CHANGEME}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-CHANGEME}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?defina LANGFUSE_ENCRYPTION_KEY (openssl rand -hex 32)}
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  # Migrations do ClickHouse usam o protocolo nativo (porta 9000), não o
  # endpoint HTTP acima (porta 8123) — os dois apontam para o mesmo
  # container, só falam protocolos diferentes.
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-CHANGEME}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-CHANGEME}@langfuse-redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-CHANGEME123}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  langfuse-postgres:
    image: postgres:17
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-CHANGEME}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [house-price-net]

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ["observability"]
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-CHANGEME}
      CLICKHOUSE_DB: langfuse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [house-price-net]

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: ["observability"]
    entrypoint: sh
    # MinIO em modo filesystem trata cada diretório de topo em /data como um
    # bucket — criar /data/langfuse antes de subir o server é como o
    # compose oficial do Langfuse provisiona o bucket sem um passo `mc mb`
    # separado.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-CHANGEME123}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [house-price-net]

  langfuse-redis:
    image: redis:7
    profiles: ["observability"]
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:-CHANGEME}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-CHANGEME}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [house-price-net]

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    profiles: ["observability"]
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    networks: [house-price-net]

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    profiles: ["observability"]
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-CHANGEME}
      NEXTAUTH_URL: http://localhost:3000
      # Inicialização headless: cria org/projeto/usuário/par de chaves no
      # primeiro startup, sem precisar passar pela UI (ver
      # https://langfuse.com/self-hosting/administration/headless-initialization).
      LANGFUSE_INIT_ORG_ID: house-price-org
      LANGFUSE_INIT_ORG_NAME: House Price Prediction
      LANGFUSE_INIT_PROJECT_ID: house-price-api
      LANGFUSE_INIT_PROJECT_NAME: house-price-api
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?defina LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?defina LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@house-price.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?defina LANGFUSE_INIT_USER_PASSWORD}
    networks: [house-price-net]

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
